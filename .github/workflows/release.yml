name: Release

# Fires whenever a tag matching v* is pushed (e.g. v0.1.1, v1.0.0).
# Builds the Windows installer in CI and attaches it to a GitHub Release
# created at the same tag, with notes built from the commit log since
# the previous tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed by softprops/action-gh-release to create / update the Release.
  contents: write

env:
  # softprops/action-gh-release still ships as v2 (no v3 with Node 24 yet).
  # This env var forces all JS actions on the runner onto Node 24, which
  # silences the Node 20 deprecation warnings GitHub will start enforcing
  # in June 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    # Pinned explicitly to windows-2025 instead of windows-latest. GitHub's
    # been emitting deprecation notices that windows-latest is being
    # redirected to a new variant (windows-2025-vs2026) on June 15, 2026.
    # We don't need VS 2026 specifically — just Node + Electron Forge — so
    # pinning to the current stable image now means the build won't move
    # under us when the alias flips. Bump explicitly if/when we need a
    # newer image (or, e.g., a different MSVC for any native deps we add).
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need the full history so `git describe` can find the previous
          # tag when building release notes.
          fetch-depth: 0
          # Without this, `actions/checkout` fetches the commit at the tag
          # ref but not the tag OBJECT (the annotated-tag wrapper around
          # the commit). That made `git tag -l --format='%(contents:body)'`
          # return empty in CI for v0.5.x and v0.6.0, so the curated notes
          # we put on the tag body never landed and we had to `gh release
          # edit` after every release. Asking for tags explicitly fixes it.
          fetch-tags: true

      - name: Force-refetch tags
        # Belt-and-suspenders against an intermittent fetch-tags hiccup
        # in actions/checkout@v5. v0.7.0–v0.10.0 picked up annotated tag
        # bodies fine, but v0.11.0's run reported tagType='commit' for
        # the firing tag — meaning the local repo had the tag as a
        # lightweight commit-pointer instead of the annotated-tag
        # OBJECT we pushed. The diagnostic printed
        # `annotated-length=0` and the release notes fell through to
        # the auto-generated commit list.
        #
        # An explicit `git fetch --tags --force origin` after checkout
        # rebuilds the local tag database from the remote — if the
        # firing tag is annotated on the remote (which is how we
        # always create it), this step guarantees the local repo
        # sees it as an annotated tag. Cheap (~1s); runs every build.
        shell: pwsh
        run: |
          git fetch origin --tags --force --no-recurse-submodules
          $type = (git tag -l --format='%(objecttype)' "${{ github.ref_name }}") -join "`n"
          Write-Host "Post-fetch tag type for ${{ github.ref_name }}: '$($type.Trim())'"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run make

      - name: E2E smoke (Playwright on packaged app)
        # S8: launches `out/Orchestrator-win32-x64/Orchestrator.exe`
        # (left behind by `npm run make` alongside the installer) and
        # asserts that the renderer mounts. If this fails the release
        # is blocked — better to leave the tag without an artifact
        # than ship a build that refuses to start (cf. the v0.4.0
        # asar-integrity silent-fail bug, which would have been
        # caught here).
        run: npm run test:e2e

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $exe = "out/make/squirrel.windows/x64/Orchestrator-Setup.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Installer not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Installer size: $($size.ToString('F1')) MB"

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Find the previous tag (if any) so we can build a compare URL
          # regardless of which notes source wins below.
          # 2>$null suppresses git's "no names found" stderr on the first release.
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }

          # Prefer the annotated tag's body when present. Lets the release
          # author hand-write curated notes via `git tag -a vX.Y.Z -m "..."`
          # without a post-release `gh release edit` round-trip. The
          # `%(contents:body)` format gives everything AFTER the tag's
          # subject line — the subject is reserved for the tag's short title.
          #
          # Gated on objecttype=tag so a lightweight tag's `(contents:body)`
          # (which falls back to the pointed commit's body) can't get
          # accidentally picked up as curated notes.
          #
          # Use `-join` to coalesce multi-line stdout into one string.
          # `(value -as [string])` returns $null when the source is an
          # array, which silently nukes multi-line curated notes — that
          # bug shipped in v0.5.1 and made the dogfood release fall
          # through to auto-notes despite the annotated tag being correct.
          $tagType = (git tag -l --format='%(objecttype)' "$tag") -join "`n"
          $annotated = ""
          if ($tagType.Trim() -eq 'tag') {
            $annotated = ((git tag -l --format='%(contents:body)' "$tag") -join "`n").Trim()
          }
          # Diagnostic: print what git saw so we can debug the curated-notes
          # path without re-tagging. v0.5.x + v0.6.0 silently fell through
          # to git-log auto-notes because the tag object wasn't fetched into
          # the runner's local repo.
          Write-Host "tag=$tag tagType='$($tagType.Trim())' annotated-length=$($annotated.Length)"

          if (-not [string]::IsNullOrWhiteSpace($annotated)) {
            Write-Host "Using curated notes from annotated tag body."
            if ([string]::IsNullOrEmpty($prev)) {
              $body = $annotated
            } else {
              $url = "https://github.com/${{ github.repository }}/compare/$prev...$tag"
              $body = "$annotated`n`n**Full Changelog**: $url"
            }
          } elseif ([string]::IsNullOrEmpty($prev)) {
            $body = "Initial release."
          } else {
            Write-Host "No annotated tag body — falling back to git-log auto-notes."
            $log = git log --pretty=format:"- %s (%h)" "$prev..$tag"
            # Drop noisy entries — version bumps and merge commits don't
            # tell a user anything they didn't already know.
            $filtered = ($log -split "`n" | Where-Object {
              $_ -notmatch "^- chore: bump" -and $_ -notmatch "^- Merge "
            }) -join "`n"
            if ([string]::IsNullOrWhiteSpace($filtered)) {
              $filtered = "_No user-facing changes (version bump + housekeeping only)._"
            }
            $url = "https://github.com/${{ github.repository }}/compare/$prev...$tag"
            # Plain string concatenation with `n escapes — here-strings'
            # required column-0 closing tag breaks YAML block-scalar parsing.
            $body = "## Changes since $prev`n`n$filtered`n`n**Full Changelog**: $url"
          }
          Write-Host "----- Release notes preview -----"
          Write-Host $body
          Write-Host "---------------------------------"
          # Multiline outputs use the delimiter syntax. New random delim per
          # run so body content can never collide with it.
          $delim = "EOF_" + [Guid]::NewGuid().ToString("N")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delim"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The .exe is the first-install artifact; RELEASES + *.nupkg are
          # the Squirrel update feed. update.electronjs.org reads them from
          # the GitHub Release to serve auto-updates to existing installs.
          # Glob expansion picks up both full and delta nupkgs when present.
          files: |
            out/make/squirrel.windows/x64/Orchestrator-Setup.exe
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/*.nupkg
          name: Orchestrator ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          # Tags containing a hyphen (e.g. v0.2.0-beta.1) auto-flagged as
          # prerelease. Stable tags (v1.0.0) become full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
