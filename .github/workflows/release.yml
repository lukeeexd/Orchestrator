name: Release

# Fires whenever a tag matching v* is pushed (e.g. v0.1.1, v1.0.0).
# Builds the Windows installer in CI and attaches it to a GitHub Release
# created at the same tag, with auto-generated notes from commits since
# the previous tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed by softprops/action-gh-release to create/update the Release.
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run make

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $exe = "out/make/squirrel.windows/x64/Orchestrator-Setup.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Installer not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Installer size: $($size.ToString('F1')) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The .exe is the only artifact end-users need. RELEASES + nupkg
          # are Squirrel auto-update metadata; once auto-update is wired
          # (v1.1+), add them here as well.
          files: out/make/squirrel.windows/x64/Orchestrator-Setup.exe
          name: Orchestrator ${{ github.ref_name }}
          generate_release_notes: true
          # Mark prereleases for tags like v0.1.0-beta.1. Stable tags
          # (v1.0.0) become full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
